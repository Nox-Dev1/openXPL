<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Page</title>
  <style>
    body {
      background-color: #1f1f1f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    img {
      max-width: 150px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 10px 0;
    }
    p {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <!-- Logo at the top -->
  <img src="logo.png" alt="Logo">

  <!-- Header text -->
  <h1>Welcome to My Page</h1>

  <!-- Normal text -->
  <p>This is a simple HTML page with a dark background and a logo at the top.</p>
</body>
</html>
